# Installed at /etc/logrotate.d/openresty.
#
# The router writes three logs (access, diag, error) and the box has a 30 GB disk,
# so this is not optional: the previous host nginx accumulated 248 MB of logs.
# `diag.log` is the chatty one — it gets a line per request including bot scans.
/var/log/openresty/*.log {
    create 0640 nobody root
    daily
    rotate 10
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        /bin/kill -USR1 `cat /usr/local/openresty/nginx/logs/nginx.pid 2>/dev/null` 2>/dev/null || true
    endscript
}
