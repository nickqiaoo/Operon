# Drop-in for the packaged openresty.service.
# Installed at /etc/systemd/system/openresty.service.d/override.conf
[Unit]
# The Lua router dials the brokers over the compose bridge, so the bridge has to
# exist first. Without this the unit can start before docker on a cold boot and
# every request 502s until something restarts it.
After=docker.service
Wants=docker.service

[Service]
EnvironmentFile=/etc/openresty/env
Restart=on-failure
RestartSec=2s
