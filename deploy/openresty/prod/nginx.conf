# operon-broker — single-layer native OpenResty front (production).
#
#   internet ─▶ Cloudflare (proxied, Full (strict))
#            ─▶ THIS process on :443  ── TLS termination, gzip, Lua routing ──▶ broker1 / broker2
#
# This file replaces what used to be two hops: a host nginx on :80/:443 that
# terminated TLS and proxied to an in-compose OpenResty on 127.0.0.1:18080 that
# did the Lua routing. OpenResty *is* nginx, so the split bought nothing and cost
# an extra proxy hop, a second buffering layer and a docker-proxy per request.
#
# The brokers, Redis and Postgres stay in compose. This process reaches them over
# the compose bridge on their static addresses (172.30.81.0/24, pinned in
# docker-compose.yml), which the host routes to directly.
#
# Deployed to /usr/local/openresty/nginx/conf/nginx.conf; env comes from
# /etc/openresty/env via the systemd drop-in; Lua lives in /etc/openresty/lua.

user nobody nobody;
worker_processes auto;
error_log /var/log/openresty/error.log notice;
pid /usr/local/openresty/nginx/logs/nginx.pid;

# nginx strips the environment by default; pass through what route.lua reads.
env REDIS_HOST;
env REDIS_PORT;
env BROKER_BACKENDS;
env DNS_RESOLVER;

events {
    worker_connections 8192;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    lua_package_path "/etc/openresty/lua/?.lua;;";
    lua_shared_dict rr 1m;    # round-robin counter
    lua_shared_dict dns 1m;   # resolved broker IPs (short TTL)
    lua_shared_dict bad 1m;   # backends ejected after a connect failure (passive health)
    lua_shared_dict drain 1m; # cached broker drain markers (short TTL)

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    server_tokens       off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Timing + compression fields the main format lacks: tells a slow upstream
    # from a slow link, and a gzip miss from a gzip hit.
    log_format diag '$time_local "$request" $status $body_bytes_sent '
                    'rt=$request_time ae="$http_accept_encoding" '
                    'ct="$sent_http_content_type" gz=$gzip_ratio '
                    'be="$upstream_addr" ut=$upstream_response_time';

    access_log /var/log/openresty/access.log main;
    access_log /var/log/openresty/diag.log   diag;

    # Compress API responses. Clients are in Asia and bytes on the wire dominate
    # response time far more than CPU here. Measured ~5x on real transcript JSON.
    #
    # `gzip_proxied any` is load-bearing rather than boilerplate: requests arrive
    # through Cloudflare and carry a Via header, and the default (`off`) declines
    # to compress exactly those — without this line the block is a no-op in
    # production while looking enabled.
    #
    # text/event-stream and application/x-ndjson are deliberately absent from
    # gzip_types. Every streaming endpoint behind this proxy uses one of them
    # (agent downlink, chat resume, /api/ai/chat), and compressing a stream makes
    # nginx buffer it — trading a page-load win for a broken live feed.
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      application/json;

    # WebSocket upgrade (terminal): pass Connection: upgrade through, else close.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Dynamic upstream: the real peer is chosen per-request by balancer_by_lua.
    upstream broker {
        server 0.0.0.1:1;  # placeholder, always overridden
        balancer_by_lua_block { require("route").balance() }
    }

    # Anything not addressed to the API hostname (IP scans, stray vhosts) is
    # dropped without a response rather than served a default page.
    server {
        listen      80  default_server;
        listen      [::]:80 default_server;
        listen      443 ssl default_server;
        listen      [::]:443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/openresty/certs/origin.pem;
        ssl_certificate_key /etc/openresty/certs/origin.key;

        return 444;
    }

    server {
        listen      80;
        listen      [::]:80;
        server_name operon-api.chatcode.top;
        return 301 https://$host$request_uri;
    }

    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        http2       on;
        server_name operon-api.chatcode.top;

        # Cloudflare (proxied) terminates the client TLS and re-encrypts to this
        # origin with a Cloudflare Origin CA certificate (SSL mode: Full (strict)).
        ssl_certificate     /etc/openresty/certs/origin.pem;
        ssl_certificate_key /etc/openresty/certs/origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 25m;

        # Long-lived tunnel + agent streams.
        proxy_http_version 1.1;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Don't let the proxy add its own buffering on streamed bodies.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # Fail fast onto a dead instance so the balancer can retry quickly.
        proxy_connect_timeout 2s;
        # Retry the next (live) backend on connect errors/timeouts. NOT
        # non_idempotent: POSTs are never retried, so a chat turn can't be
        # double-run.
        proxy_next_upstream error timeout;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # broker's refreshCookieSecure() reads this to decide the cookie's Secure
        # flag; it is the only forwarded header the broker actually inspects.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Node downlink (SSE): broker→node frames.
        location = /agent/down {
            access_by_lua_block { require("route").route() }
            proxy_pass http://broker;
        }

        # Node uplink (streaming POST, NDJSON): node→broker frames.
        # proxy_request_buffering off (above) is what keeps this streaming.
        location = /agent/up {
            # This is a long-lived streaming request. Do not cap cumulative body
            # size here; the broker enforces per-frame limits while parsing NDJSON.
            client_max_body_size 0;
            access_by_lua_block { require("route").route() }
            proxy_pass http://broker;
        }

        # Web API + terminal WebSocket — path carries /u/<uid>/n/<nid>/.
        location ~ ^/u/[^/]+/n/[^/]+/ {
            access_by_lua_block { require("route").route() }
            proxy_pass http://broker;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Identity / health / everything else: any instance (state is in Redis + PG).
        location / {
            access_by_lua_block { require("route").route() }
            proxy_pass http://broker;
        }
    }

    # Other services fronted by this process, one file each. They are plain
    # proxies with no Lua routing, and stay out of this file so deploying one
    # does not touch the broker's config.
    include /etc/openresty/sites/*.conf;
}
