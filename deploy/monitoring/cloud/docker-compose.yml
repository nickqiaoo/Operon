name: operon-cloud-monitoring

services:
  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    env_file: .env
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
    # Docker API access is needed to follow broker logs across container restarts.
    user: "0:0"
    mem_limit: 256m
    networks: [broker]

  cloud-node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|run|var/lib/docker)($|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 48m
    networks: [broker]

networks:
  broker:
    name: operon-broker_internal
    external: true

volumes:
  alloydata:
