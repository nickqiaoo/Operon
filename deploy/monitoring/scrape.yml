# VictoriaMetrics scrape config (Prometheus-compatible).
# Brokers are reached by their fixed IPs on operon-broker_internal (172.30.81.11/12).
# /metrics is served on the in-cluster :8080 and is NOT exposed through the front router.
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: broker
    static_configs:
      - targets:
          - "172.30.81.11:8080"
          - "172.30.81.12:8080"
    relabel_configs:
      - source_labels: [__address__]
        regex: "172.30.81.11:8080"
        target_label: instance
        replacement: broker1
      - source_labels: [__address__]
        regex: "172.30.81.12:8080"
        target_label: instance
        replacement: broker2

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
