<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Operon icon">

  <!-- macOS squircle background -->
  <path
    d="M512 0
       C962 0 1024 62 1024 512
       C1024 962 962 1024 512 1024
       C62 1024 0 962 0 512
       C0 62 62 0 512 0 Z"
    fill="#F6F6FA"
  />

  <defs>
  <linearGradient id="helixGrad" x1="176" y1="176" x2="848" y2="848" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#9D92F5"/>
    <stop offset="48%" stop-color="#7B72E4"/>
    <stop offset="100%" stop-color="#5249C7"/>
  </linearGradient>
</defs>

<!-- Strand 1 -->
<path
  d="M 512 176
