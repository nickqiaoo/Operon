     C 620 804 530 780 480 720
     C 420 648 440 560 512 512"
  fill="none"
  stroke="url(#helixGrad)"
  stroke-width="72"
  stroke-linecap="round"
/>

<!-- Strand 2 -->
<path
  d="M 512 848
     C 324 848 176 700 176 512
     C 176 404 234 314 324 264
     C 404 220 494 244 544 304
     C 604 376 584 464 512 512"
  fill="none"
  stroke="url(#helixGrad)"
  stroke-width="72"
  stroke-linecap="round"
/>

  <!-- ">" chevron -->
  <path
    d="M 370 360 L 470 420 L 370 480"
    fill="none"
