name: Release macOS

# Builds, signs and notarizes both macOS architectures in parallel, one runner each.
#
# Called from test.yml on every push to main WITHOUT waiting for the tests, so the
# ~10 min build overlaps them. test.yml publishes (release-mac-publish.yml) only
# once both the tests and this build have passed; a build whose tests fail is
# simply never published.
#
# workflow_dispatch rebuilds a version by hand and publishes it right away.
on:
  workflow_call:
    outputs:
      version:
        description: Desktop version that was built, or empty when there is nothing to release
        value: ${{ jobs.version.outputs.version }}
  workflow_dispatch:
    inputs:
      release_version:
        description: Desktop version on main to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Check desktop version
    if: github.repository == 'Nickqiaoo/Operon' && github.ref == 'refs/heads/main' && ((github.event_name == 'push' && !github.event.deleted) || (github.event_name == 'workflow_dispatch' && inputs.release_version != ''))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      # A push releases the version in package.json when it is stable, newer than
      # the latest published release, and not published yet. This deliberately
      # does not look at what the push changed: comparing against the previous
      # commit lost a release whenever the version-bump commit failed its tests,
      # because the next push no longer "increased" the version. Now any later
      # push with passing tests picks the pending version up again.
      - name: Verify the requested release or find an unpublished stable version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          current=$(node -p 'require("./package.json").version')
          if [[ ! "$current" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            if [[ -n "$REQUESTED_VERSION" ]]; then
              echo "::error::Requested release must match the stable desktop version on main."
              exit 1
            fi
            echo "Desktop version $current is not a stable release."
            exit 0
          fi

          if [[ -n "$REQUESTED_VERSION" ]]; then
            if [[ "$current" != "$REQUESTED_VERSION" ]]; then
              echo "::error::Requested release must match the stable desktop version on main."
              exit 1
            fi
          else
            # Drafts are invisible to this read-only token, so a half-finished
            # draft counts as unpublished, which is what we want.
            if [[ "$(gh release view "v$current" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
              echo "v$current is already published."
              exit 0
            fi
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
            if [[ -n "$latest" ]] && ! node -e '
              const parse = (v) => v.replace(/^v/, "").split(/[-+]/)[0].split(".").map(Number)
              const [a, b] = [parse(process.argv[1]), parse(process.argv[2])]
              const order = a[0] - b[0] || a[1] - b[1] || a[2] - b[2]
              process.exit(order > 0 ? 0 : 1)
            ' "$current" "$latest"; then
              echo "Desktop version $current is not newer than the latest release $latest."
              exit 0
            fi
          fi

          node scripts/extract-release-notes.mjs "$current" > /dev/null
          echo "Releasing $current."
          echo "version=$current" >> "$GITHUB_OUTPUT"

  build:
    name: Build and sign macOS ${{ matrix.arch }}
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: macos-26
    timeout-minutes: 120
    environment: production
    strategy:
      # One architecture failing makes the release unpublishable; stop the other.
      fail-fast: true
      matrix:
        include:
          # Both run on Apple Silicon runners; x64 is cross-compiled, as it was
          # when both architectures shared one runner.
          - arch: arm64
            app: release/mac-arm64/Operon.app
            lipo_arch: arm64
          - arch: x64
            app: release/mac/Operon.app
            lipo_arch: x86_64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          SKIP_ELECTRON_REBUILD: '1'

      # Type checking does not depend on the architecture; once is enough.
      - name: TypeScript check
        if: matrix.arch == 'arm64'
        run: npx tsc

      - name: Build, sign and notarize
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing or notarization setting: $name"
              exit 1
            fi
          done
          bash scripts/build-mac-arch.sh "${{ matrix.arch }}"

      - name: Verify signed and notarized app
        run: |
          codesign --verify --deep --strict "${{ matrix.app }}"
          xcrun stapler validate "${{ matrix.app }}"
          lipo "${{ matrix.app }}/Contents/MacOS/Operon" -verify_arch "${{ matrix.lipo_arch }}"

      # arm64 uploads latest-mac-arm64.yml, x64 uploads latest-mac.yml; the
      # publish job downloads both into one folder and merges them.
      - uses: actions/upload-artifact@v6
        with:
          name: macos-${{ needs.version.outputs.version }}-${{ matrix.arch }}
          path: |
            release/Operon-${{ needs.version.outputs.version }}*.dmg
            release/Operon-${{ needs.version.outputs.version }}*.zip
            release/Operon-${{ needs.version.outputs.version }}*.blockmap
            release/latest-mac*.yml
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  # The headless node for Linux servers (`operon serve` / `operon node join`), as an
  # npm tarball attached to the same release. Not macOS, but it ships with every
  # desktop version, so it is built and published alongside it.
  node-package:
    name: Build headless node package
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          SKIP_ELECTRON_REBUILD: '1'

      - name: Build the package
        run: node scripts/build-node-package.mjs

      # Install it the way a user does, on a clean prefix, and check the node
      # actually starts and answers: a missing external or runtime file only
      # shows up when the bundle runs.
      - name: Smoke test
        run: |
          prefix="$RUNNER_TEMP/operon-node"
          npm install -g --prefix "$prefix" "$GITHUB_WORKSPACE/release/operon-node-${{ needs.version.outputs.version }}.tgz"
          "$prefix/bin/operon" --version
          export OPERON_HOME="$RUNNER_TEMP/operon-home" OPERON_PORT=39417
          "$prefix/bin/operon" serve > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fs http://127.0.0.1:39417/api/health > /dev/null; then
              "$prefix/bin/operon" node status
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/serve.log"
          echo "::error::The headless node did not start"
          exit 1

      - uses: actions/upload-artifact@v6
        with:
          name: node-package-${{ needs.version.outputs.version }}
          path: release/operon-node-${{ needs.version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [version, build, node-package]
    # From test.yml the caller publishes after the tests; here only the manual path.
    if: github.event_name == 'workflow_dispatch' && needs.version.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release-mac-publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
