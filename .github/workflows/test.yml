name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: Desktop version on main to publish after tests
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # A newer PR commit can replace its tests. A push to main must not cancel
  # another commit's release after that commit has already passed its tests.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Vitest (${{ matrix.suite }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [App, Chrome]
    env:
      # These suites launch a real Chrome and use chrome-e2e-lock when run locally.
      REAL_CHROME_TESTS: >-
        packages/browser-use/playwright-injected.test.ts
        packages/browser-use/sdk-inject-navigation.test.ts
        packages/browser-use/sdk-locator-real.test.ts
        packages/browser-use/switchover.e2e.test.ts
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          SKIP_ELECTRON_REBUILD: '1'

      - name: Rebuild better-sqlite3 for system Node
        if: matrix.suite == 'App'
        run: npm rebuild better-sqlite3

      - name: Run application tests
        if: matrix.suite == 'App'
        run: |
          read -ra chrome_tests <<< "$REAL_CHROME_TESTS"
          exclude=()
          for file in "${chrome_tests[@]}"; do
            exclude+=(--exclude "$file")
          done
          npm test -- "${exclude[@]}"

      # Missing Chrome would silently skip the real browser suites.
      - name: Verify Chrome is present
        if: matrix.suite == 'Chrome'
        run: |
          if [ ! -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]; then
            echo "Chrome missing from the runner image; installing"
            brew install --cask google-chrome
          fi
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version

      - name: Run real Chrome tests
        if: matrix.suite == 'Chrome'
        run: |
          read -ra chrome_tests <<< "$REAL_CHROME_TESTS"
          npm test -- --no-file-parallelism "${chrome_tests[@]}"

      - name: Report skipped suites
        if: always() && matrix.suite == 'App'
        run: |
          echo "Intentionally not run here:"
          echo "  cua-driver-live.e2e.test.ts requires OPERON_CUA_DRIVER_BIN"
          echo "  e2e/*.spec.ts (dev project) drives live provider CLIs over CDP"
          echo "  *.browser.test.tsx (npm run test:browser) is the browser-mode suite"

  swift:
    name: Swift
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/computer-use
    steps:
      - uses: actions/checkout@v6

      - name: Build the Swift computer-use service
        run: swift build

      - name: Test the Swift computer-use service
        run: swift test

  # The e2e/specs UI suite: Playwright starts the test server (fake runtime, its own HOME and
  # DB) and the vite renderer, then drives headless Chromium. A separate job so it runs
  # alongside the other suites and fails on its own line.
  e2e:
    name: E2E (Playwright)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          SKIP_ELECTRON_REBUILD: '1'

      # The test server runs under system Node, not Electron.
      - name: Rebuild better-sqlite3 for system Node
        run: npm rebuild better-sqlite3

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run Playwright specs
        run: npm run test:e2e:ci -- --reporter=list,html

      # Traces and screenshots of the failed specs (trace is recorded on the retry).
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release:
    name: Release macOS
    needs: [test, swift, e2e]
    if: github.repository == 'Nickqiaoo/Operon' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    uses: ./.github/workflows/release-mac.yml
    with:
      release_version: ${{ inputs.release_version || '' }}
    secrets: inherit
