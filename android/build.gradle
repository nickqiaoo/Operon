// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'
        // The app module is pure Kotlin. Capacitor's generated scripts
        // (capacitor.build.gradle) never touch this, so `npx cap sync`
        // cannot undo it.
        //
        // Version is literal rather than read from variables.gradle: Gradle
        // lifts `buildscript` out and runs it before the rest of the file,
        // so the `apply from` below has not happened yet.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
