<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Repairing Operon</title>
    <style>
      :root {
        color: #18181b;
        background: #f8f8fb;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 420px);
        padding: 28px;
        box-sizing: border-box;
        border: 1px solid #e4e4ea;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 18px 60px rgba(24, 24, 27, 0.08);
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        line-height: 1.3;
      }

      p {
        margin: 0;
        color: #71717a;
        font-size: 15px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Repairing Operon</h1>
      <p id="status">Clearing cached app files…</p>
    </main>
    <script>
      (async function () {
        var recoveryAttemptKey = 'operon:pwa-recovery-attempt:v1';
        var status = document.getElementById('status');
        var returnUrl = new URL('/', location.origin);
        var requestedReturn = new URLSearchParams(location.search).get('return');

        if (requestedReturn) {
          try {
            var candidate = new URL(requestedReturn, location.origin);
            if (candidate.origin === location.origin) {
              returnUrl = candidate;
            }
          } catch {}
        }

        try {
          var registrations = 'serviceWorker' in navigator
            ? await navigator.serviceWorker.getRegistrations()
            : [];
          var cacheNames = 'caches' in window ? await caches.keys() : [];

          await Promise.all([
            ...registrations.map(function (registration) {
              return registration.unregister();
            }),
            ...cacheNames.map(function (cacheName) {
              return caches.delete(cacheName);
            }),
          ]);
        } catch {
          // The Clear-Site-Data response header still repairs the HTTP cache
          // when browser storage APIs are unavailable.
        }

        // Must match the store index.html reads. localStorage, not
        // sessionStorage: a PWA reloaded from start_url loses sessionStorage, so
        // the "already tried repairing" marker disappeared and a still-broken
        // boot bounced straight back here in a loop.
        try {
          localStorage.setItem(recoveryAttemptKey, '1');
        } catch {}

        if (status) {
          status.textContent = 'Restarting…';
        }

        returnUrl.searchParams.set('__operon_recovery', Date.now().toString());
        location.replace(returnUrl.href);
      })();
    </script>
  </body>
</html>
